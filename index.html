/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 350px;
    height: 310px;

    overflow: hidden;

    background: transparent;

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

}


/* =========================================================
   MAIN MINECRAFT GUI
========================================================= */

#minecraft {

    width: 350px;
    height: 310px;

    position: relative;

    overflow: hidden;

    background: #c6c6c6;

    image-rendering: pixelated;

    color: #404040;

    padding: 18px 20px;

}


/* Minecraft GUI subtle texture */

#minecraft::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .08;

    background-image:
        linear-gradient(
            45deg,
            rgba(255,255,255,.35) 25%,
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.15) 75%
        );

    background-size: 4px 4px;

}


/* =========================================================
   CONTENT
========================================================= */

.content {

    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;

}


/* =========================================================
   TITLE
========================================================= */

.title {

    height: 25px;

    font-family:
        "Press Start 2P",
        "Courier New",
        monospace;

    font-size: 15px;

    font-weight: 400;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

    letter-spacing: .2px;

}


/* =========================================================
   CRAFTING AREA
========================================================= */

.crafting {

    width: 100%;

    display: flex;

    align-items: center;

    margin-top: 5px;

}


/* =========================================================
   3x3 GRID
========================================================= */

.grid {

    width: 150px;
    height: 150px;

    display: grid;

    grid-template-columns:
        repeat(3, 50px);

    grid-template-rows:
        repeat(3, 50px);

}


/* =========================================================
   MINECRAFT SLOT
========================================================= */

.slot {

    width: 50px;
    height: 50px;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #8b8b8b;

    border-top:
        3px solid #373737;

    border-left:
        3px solid #373737;

    border-right:
        3px solid #ffffff;

    border-bottom:
        3px solid #ffffff;

    /* Relieve interior limpio, sin la L invertida. */
    box-shadow:
        inset 2px 2px 0 rgba(40,40,40,.34),
        inset -2px -2px 0 rgba(255,255,255,.10);

}


/* inner shadow */

.slot::after {

    content: "";

    position: absolute;

    inset: 4px;

    border:
        1px solid rgba(45,45,45,.18);

    box-shadow:
        inset 0 0 3px rgba(0,0,0,.12);

    pointer-events: none;

}


/* =========================================================
   ITEM
========================================================= */

.item {

    width: 38px;
    height: 38px;

    object-fit: contain;

    image-rendering: pixelated;

    position: relative;

    z-index: 3;

    filter:
        drop-shadow(
            2px 2px 0 rgba(0,0,0,.45)
        );

    transform-origin: center center;

    animation:
        itemPop
        .34s
        cubic-bezier(.22,1.35,.45,1)
        both;

}

@keyframes itemPop {

    0% {
        opacity: 0;
        transform: scale(.15);
    }

    55% {
        opacity: 1;
        transform: scale(1.16);
    }

    78% {
        transform: scale(.94);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================================================
   ARROW
========================================================= */

.arrow-container {

    width: 105px;

    display: flex;

    justify-content: center;

    align-items: center;

}


.arrow {

    width: 55px;
    height: 34px;

    position: relative;

}


/* arrow body */

.arrow::before {

    content: "";

    position: absolute;

    left: 0;

    top: 11px;

    width: 38px;

    height: 12px;

    background: #777;

}


/* arrow head */

.arrow::after {

    content: "";

    position: absolute;

    right: 0;

    top: 2px;

    width: 0;
    height: 0;

    border-top:
        16px solid transparent;

    border-bottom:
        16px solid transparent;

    border-left:
        20px solid #777;

}


/* =========================================================
   RESULT SLOT
========================================================= */

.result-slot {

    width: 68px;
    height: 68px;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #8b8b8b;

    border-top:
        4px solid #373737;

    border-left:
        4px solid #373737;

    border-right:
        4px solid #ffffff;

    border-bottom:
        4px solid #ffffff;

    box-shadow:
        inset 2px 2px 0 rgba(40,40,40,.34),
        inset -2px -2px 0 rgba(255,255,255,.10);

}


/* result inner */

.result-slot::after {

    content: "";

    position: absolute;

    inset: 5px;

    border:
        1px solid rgba(45,45,45,.18);

    box-shadow:
        inset 0 0 4px rgba(0,0,0,.14);

    pointer-events: none;

/* =========================================================
   QUESTION
========================================================= */

.question {

    margin-top: 8px;

    font-family:
        "Press Start 2P",
        "Courier New",
        monospace;

    font-size: 10px;

    font-weight: 400;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

/* =========================================================
   STATUS
========================================================= */

.status {

    margin-top: 8px;

    min-height: 16px;

    font-size: 8px;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

/* =========================================================
   ANSWER
========================================================= */

.answer {

    margin-top: 2px;

    min-height: 20px;

    font-size: 10px;

    font-weight: 700;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

}


.answer.correct {

    color: #209020;

}


/* =========================================================
   CHAT INDICATOR
========================================================= */

.chat {

    position: absolute;

    right: 2px;

    bottom: 4px;

    font-size: 8px;

    color: #555;

    text-shadow:
        1px 1px #fff;

/* =========================================================
   RESULT ANIMATION
========================================================= */

.result-show {

    animation:
        resultPop

@keyframes resultPop {

    0% {
        opacity: 0;
        transform: scale(.25);
    }

    55% {
        opacity: 1;
        transform: scale(1.18);
    }

    78% {
        transform: scale(.94);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

/* =========================================================
   PARTICIPANTS
========================================================= */

.participants {

    bottom: 5px;

    height: 32px;

    display: flex;

    align-items: center;

    gap: 6px;

========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const requestedChannel =
    params.get("channel");


let CHANNEL =
    (
        !requestedChannel ||
        requestedChannel === "{channel}" ||
        requestedChannel.includes("{") ||
        requestedChannel.includes("}")
    )
        ? "rubius"
        : requestedChannel;


CHANNEL =
    CHANNEL
        .replace("#", "")
        .trim()
        .toLowerCase();

========================================================= */

*/

/*
    Versión de Minecraft usada para
    los assets.
*/

const MINECRAFT_VERSION = "26.3";


/* =========================================================
   ASSET URL
========================================================= */


/*
    Assets vanilla de Minecraft.

    Ejemplo:

    minecraft:diamond

    se convierte en:

    textures/item/diamond.png
*/

/*
    =========================================================
    MINECRAFT ITEM TEXTURES
    =========================================================

    Cargamos los PNG vanilla desde el manifest oficial del
    paquete minecraft-textures. El manifest legacy contiene
    las imágenes como data:image/png;base64,..., así que
    el navegador no depende de que una imagen externa
    permita CORS.
*/

const ITEM_TEXTURES = new Map();

const TEXTURE_MANIFEST_URL =
    "https://cdn.jsdelivr.net/npm/minecraft-textures@26.3.0/dist/textures/json/26.3.json";


async function loadItemTextures() {

    try {

        const response =
            await fetch(
                TEXTURE_MANIFEST_URL,
                {
                    cache: "force-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        if (
            data &&
            Array.isArray(data.items)
        ) {

            data.items.forEach(
                item => {

                    if (
                        item &&
                        item.id &&
                        item.texture
                    ) {

                        ITEM_TEXTURES.set(
                            item.id,
                            item.texture
                        );

                    }

                }
            );

        }


        console.log(
            "Texturas Minecraft cargadas:",
            ITEM_TEXTURES.size
        );

    } catch (error) {

        console.warn(
            "No se pudo cargar el manifest de texturas.",
            error
        );

    }

}


function getTexture(id) {

    if (!id) {

        return "";

    }


    const clean =
        id
            .replace(
                "minecraft:",
                ""
            );


    const minecraftId =
        "minecraft:" +
        clean;


    /*
        Preferimos la imagen embebida en base64.
    */

    if (
        ITEM_TEXTURES.has(
            minecraftId
        )
    ) {

        return ITEM_TEXTURES.get(
            minecraftId
        );

    }


    /*
        Respaldo visual externo.
    */

    return (
        "https://mcasset.cloud/26.3/assets/minecraft/textures/item/" +
        clean +
        ".png"
    );

}

/* =========================================================
   STATE
========================================================= */

let currentRecipe = null;

let previousRecipe = null;

let locked = false;

let lastMessageTime = 0;

let twitchClient = null;


/* =========================================================
   DOM
========================================================= */

const grid =
    document.getElementById("grid");

const result =
    document.getElementById("result");

const status =
    document.getElementById("status");

const answer =
    document.getElementById("answer");

const chatStatus =
    document.getElementById("chatStatus");

const participants =
    document.getElementById("participants");


/* =========================================================
   PARTICIPANTES / SKINS
========================================================= */

/*
    Iconos aleatorios de skins/heads de Minecraft.
    Se asigna uno al usuario y se conserva durante
    la sesión del widget.
*/

/*
    Skins aleatorias de NameMC.

    Son hashes de skins de la página de skins aleatorias
    de NameMC. Usamos la miniatura de cara de NameMC
    directamente, no una skin inventada.
*/

const RANDOM_SKINS = [

    "a81fb683f4932800",
    "ddeabddcaf39951f",
    "ec34fb90262539ce",
    "ffdf6cd46c5a07db",
    "4e8fb80f2bfefad7",
    "1304256c1c9bff39",
    "95dee22b7bd250ea",
    "ed969aab1609b602",
    "a6a59fbf4426891e",
    "e694298ac4198b12",
    "ad9a5ad4833b5c84"

];

const participantSkins =
    new Map();

let participantList = [];


function getRandomSkin(username) {

    if (participantSkins.has(username)) {

        return participantSkins.get(username);

    }


    const skin =
        RANDOM_SKINS[
            Math.floor(
                Math.random() *
                RANDOM_SKINS.length
            )
        ];


    participantSkins.set(
        username,
        skin
    );


    return skin;

}


function addParticipant(username) {

    if (!username) {
        return;
    }


    const existing =
        participantList.find(
            item =>
                item.username.toLowerCase() ===
                username.toLowerCase()
        );


    if (existing) {

        participantList =
            participantList.filter(
                item =>
                    item.username.toLowerCase() !==
                    username.toLowerCase()
            );

    }


    participantList.unshift({

        username: username,

        skin: getRandomSkin(username)

    });


    /*
        Mostramos solamente los últimos 3
        para que la zona inferior permanezca limpia.
    */

    participantList =
        participantList.slice(
            0,
            3
        );


    participants.innerHTML = "";


    participantList.forEach(
        participant => {

            const row =
                document.createElement("div");

            row.className =
                "participant";


            const img =
                document.createElement("img");

            img.className =
                "participant-skin";

            img.src =
                "https://s.namemc.com/2d/skin/face.png?id=" +
                participant.skin +
                "&scale=2";

            img.alt =
                "";


            img.onerror =
                function() {

                    this.style.display =
                        "none";

                };


            const name =
                document.createElement("span");

            name.className =
                "participant-name";

            name.textContent =
                participant.username;


            row.appendChild(img);
            row.appendChild(name);

            participants.appendChild(row);

        }
    );

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(text) {

    return String(text || "")

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-z0-9_ ]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   RANDOM RECIPE
========================================================= */

function getRandomRecipe() {

    if (RECIPES.length === 0) {

        return null;

    }


    let recipe;


    do {

        recipe =
            RECIPES[
                Math.floor(
                    Math.random() *
                    RECIPES.length
                )
            ];

    }

    while (

        RECIPES.length > 1 &&

        recipe.id ===
        previousRecipe

    );


    previousRecipe =
        recipe.id;


    return recipe;

}


/* =========================================================
   RENDER RECIPE
========================================================= */

function renderRecipe(recipe) {

    grid.innerHTML = "";


    recipe.pattern.forEach(
        (itemId) => {

            const slot =
                document.createElement(
                    "div"
                );

            slot.className =
                "slot";


            /*
                Un slot vacío.
            */

            if (
                !itemId ||
                itemId === " "
            ) {

                grid.appendChild(
                    slot
                );

                return;

            }


            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "item";

            img.style.animationDelay =
                (
                    (
                        grid.children.length
                    ) * 45
                ) +
                "ms";


            img.src =
                getTexture(
                    itemId
                );


            img.alt =
                itemId;


            img.onerror =
                function() {

                    /*
                        Si una textura no existe,
                        ocultamos la imagen en vez
                        de romper el widget.
                    */

                    this.style.display =
                        "none";

                };


            slot.appendChild(
                img
            );


            grid.appendChild(
                slot
            );

        }
    );


    /*
        Ocultar resultado.
    */

    result.style.display =
        "none";


    result.classList.remove(
        "result-show"
    );


    answer.textContent =
        "";


    answer.className =
        "answer";


    status.textContent =
        "Esperando respuesta del chat...";

}


/* =========================================================
   NEW RECIPE
========================================================= */

function newRecipe() {

    locked = false;


    currentRecipe =
        getRandomRecipe();


    if (!currentRecipe) {

        status.textContent =
            "No hay recetas disponibles.";

        return;

    }


    renderRecipe(
        currentRecipe
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    username,
    message
) {

    /*
        Cooldown de mensajes.
    */

    const now =
        Date.now();


    if (
        now -
        lastMessageTime <
        MESSAGE_COOLDOWN
    ) {

        return;

    }


    lastMessageTime =
        now;


    /*
        No procesar mientras
        estamos cambiando de receta.
    */

    if (
        locked ||
        !currentRecipe
    ) {

        return;

    }


    addParticipant(
        username
    );


    const cleanMessage =
        normalize(
            message
        );


    const validAnswers = [
        currentRecipe.name,
        ...currentRecipe.aliases
    ]
        .map(normalize);


    /*
        También permitimos que el usuario
        escriba el nombre dentro de una
        frase corta.
    */

    const isCorrect =
        validAnswers.some(
            answerText =>
                cleanMessage ===
                answerText
        );


    if (!isCorrect) {

        return;

    }


    correctAnswer(
        username
    );

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

function correctAnswer(
    username
) {

    locked = true;


    /*
        Mostrar resultado.
    */

    result.src =
        getTexture(
            currentRecipe.id
        );

    result.alt =
        currentRecipe.name;


    result.style.display =
        "block";


    result.classList.add(
        "result-show"
    );


    /*
        Mostrar ganador.
    */

    answer.textContent =
        username +
        " acertó: " +
        currentRecipe.name;


    answer.className =
        "answer correct winner";


    /*
        Countdown.
    */

    let remaining =
        NEXT_RECIPE_COOLDOWN;


    function updateCountdown() {

        const seconds =
            Math.ceil(
                remaining / 1000
            );


        status.textContent =
            "Nuevo crafteo en " +
            seconds +
            "...";

    }


    updateCountdown();


    const interval =
        setInterval(
            () => {

                remaining -= 1000;


                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        interval
                    );


                    newRecipe();


                    return;

                }


                updateCountdown();

            },
            1000
        );

}


/* =========================================================
   TWITCH CONNECTION
========================================================= */

function connectTwitch() {

    if (!CHANNEL) {

        status.textContent =
            "No se encontró el canal de Twitch.";

        chatStatus.textContent =
            "Twitch: sin canal";

        return;

    }


    if (
        typeof tmi ===
        "undefined"
    ) {

        status.textContent =
            "No se pudo cargar Twitch.";

        chatStatus.textContent =
            "Twitch: error";

        return;

    }


    if (twitchClient) {

        try {

            twitchClient.disconnect();

        } catch (e) {

            console.warn(
                "No se pudo cerrar la conexión anterior.",
                e
            );

        }

        twitchClient = null;

    }


    twitchClient =
        new tmi.Client({

            options: {
                debug: false
            },

            connection: {
                secure: true,
                reconnect: true,
                timeout: 20000
            },

            channels: [
                CHANNEL
            ]

        });


    twitchClient.on(
        "connecting",
        () => {

            chatStatus.textContent =
                "● Twitch: conectando...";

        }
    );


    twitchClient.on(
        "connected",
        () => {

            status.textContent =
                "Esperando respuesta del chat...";

            chatStatus.textContent =
                "● Twitch: " +
                CHANNEL;

        }
    );


    twitchClient.on(
        "disconnected",
        (reason) => {

            console.warn(
                "Twitch desconectado:",
                reason
            );

            chatStatus.textContent =
                "● Twitch: reconectando...";

        }
    );


    twitchClient.on(
        "reconnect",
        () => {

            chatStatus.textContent =
                "● Twitch: reconectando...";

        }
    );


    twitchClient.on(
        "message",
        (
            channel,
            tags,
            message,
            self
        ) => {

            if (self) {

                return;

            }


            const username =
                tags["display-name"] ||
                tags.username ||
                "Jugador";


            checkAnswer(
                username,
                message
            );

        }
    );


    twitchClient
        .connect()
        .catch(
            (error) => {

                console.error(
                    "Error conectando a Twitch:",
                    error
                );

                status.textContent =
                    "No se pudo conectar al chat.";

                chatStatus.textContent =
                    "Twitch: error";

            }
        );

}


/* =========================================================
   START
========================================================= */


/*
    IMPORTANTE:

    Esto hace que cada vez que el
    iframe se cargue/refresque se
    seleccione una receta nueva.
*/

/*
    Primero cargamos las texturas vanilla.
    Después mostramos la primera receta y conectamos Twitch.
*/

loadItemTextures()
    .finally(
        () => {

            newRecipe();

            connectTwitch();

        }
    );
