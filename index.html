@import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 350px;
    height: 310px;

    overflow: hidden;

    background: transparent;

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

}


/* =========================================================
   MAIN MINECRAFT GUI
========================================================= */

#minecraft {

    width: 350px;
    height: 310px;

    position: relative;

    overflow: hidden;

    background: #c6c6c6;

    image-rendering: pixelated;

    color: #404040;

    padding: 18px 20px;

}


/* Minecraft GUI subtle texture */

#minecraft::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: .08;

    background-image:
        linear-gradient(
            45deg,
            rgba(255,255,255,.35) 25%,
            transparent 25%,
            transparent 75%,
            rgba(0,0,0,.15) 75%
        );

    background-size: 4px 4px;

}


/* =========================================================
   CONTENT
========================================================= */

.content {

    position: relative;

    z-index: 2;

    width: 100%;
    height: 100%;

}


/* =========================================================
   TITLE
========================================================= */

.title {

    height: 25px;

    font-family:
        "Press Start 2P",
        "Courier New",
        monospace;

    font-size: 15px;

    font-weight: 400;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

    letter-spacing: .2px;

}


/* =========================================================
   CRAFTING AREA
========================================================= */

.crafting {

    width: 100%;

    display: flex;

    align-items: center;

    margin-top: 5px;

}


/* =========================================================
   3x3 GRID
========================================================= */

.grid {

    width: 150px;
    height: 150px;

    display: grid;

    grid-template-columns:
        repeat(3, 50px);

    grid-template-rows:
        repeat(3, 50px);

}


/* =========================================================
   MINECRAFT SLOT
========================================================= */

.slot {

    width: 50px;
    height: 50px;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #8b8b8b;

    border-top:
        3px solid #373737;

    border-left:
        3px solid #373737;

    border-right:
        3px solid #ffffff;

    border-bottom:
        3px solid #ffffff;

    /* Relieve interior limpio, sin la L invertida. */
    box-shadow:
        inset 2px 2px 0 rgba(40,40,40,.34),
        inset -2px -2px 0 rgba(255,255,255,.10);

}


/* inner shadow */

.slot::after {

    content: "";

    position: absolute;

    inset: 4px;

    border:
        1px solid rgba(45,45,45,.18);

    box-shadow:
        inset 0 0 3px rgba(0,0,0,.12);

    pointer-events: none;

}


/* =========================================================
   ITEM
========================================================= */

.item {

    width: 38px;
    height: 38px;

    object-fit: contain;

    image-rendering: pixelated;

    position: relative;

    z-index: 3;

    filter:
        drop-shadow(
            2px 2px 0 rgba(0,0,0,.45)
        );

    transform-origin: center center;

    animation:
        itemPop
        .34s
        cubic-bezier(.22,1.35,.45,1)
        both;

}

@keyframes itemPop {

    0% {
        opacity: 0;
        transform: scale(.15);
    }

    55% {
        opacity: 1;
        transform: scale(1.16);
    }

    78% {
        transform: scale(.94);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================================================
   ARROW
========================================================= */

.arrow-container {

    width: 105px;

    display: flex;

    justify-content: center;

    align-items: center;

}


.arrow {

    width: 55px;
    height: 34px;

    position: relative;

}


/* arrow body */

.arrow::before {

    content: "";

    position: absolute;

    left: 0;

    top: 11px;

    width: 38px;

    height: 12px;

    background: #777;

}


/* arrow head */

.arrow::after {

    content: "";

    position: absolute;

    right: 0;

    top: 2px;

    width: 0;
    height: 0;

    border-top:
        16px solid transparent;

    border-bottom:
        16px solid transparent;

    border-left:
        20px solid #777;

}


/* =========================================================
   RESULT SLOT
========================================================= */

.result-slot {

    width: 68px;
    height: 68px;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #8b8b8b;

    border-top:
        4px solid #373737;

    border-left:
        4px solid #373737;

    border-right:
        4px solid #ffffff;

    border-bottom:
        4px solid #ffffff;

    box-shadow:
        inset 2px 2px 0 rgba(40,40,40,.34),
        inset -2px -2px 0 rgba(255,255,255,.10);

}


/* result inner */

.result-slot::after {

    content: "";

    position: absolute;

    inset: 5px;

    border:
        1px solid rgba(45,45,45,.18);

    box-shadow:
        inset 0 0 4px rgba(0,0,0,.14);

    pointer-events: none;

}


/* =========================================================
   QUESTION
========================================================= */

.question {

    margin-top: 8px;

    font-family:
        "Press Start 2P",
        "Courier New",
        monospace;

    font-size: 10px;

    font-weight: 400;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    margin-top: 8px;

    min-height: 16px;

    font-size: 8px;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

}


/* =========================================================
   ANSWER
========================================================= */

.answer {

    margin-top: 2px;

    min-height: 20px;

    font-size: 10px;

    font-weight: 700;

    color: #404040;

    text-shadow:
        1px 1px 0 #ffffff;

}


.answer.correct {

    color: #209020;

}


/* =========================================================
   CHAT INDICATOR
========================================================= */

.chat {

    position: absolute;

    right: 2px;

    bottom: 4px;

    font-size: 8px;

    color: #555;

    text-shadow:
        1px 1px #fff;

}


/* =========================================================
   RESULT ANIMATION
========================================================= */

.result-show {

    animation:
        resultPop
        .34s
        cubic-bezier(.22,1.35,.45,1);

}


@keyframes resultPop {

    0% {
        opacity: 0;
        transform: scale(.25);
    }

    55% {
        opacity: 1;
        transform: scale(1.18);
    }

    78% {
        transform: scale(.94);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================================================
   PARTICIPANTS
========================================================= */

.participants {

    position: absolute;

    left: 20px;
    bottom: 5px;

    width: 380px;
    height: 32px;

    display: flex;

    align-items: center;

    gap: 6px;

    overflow: hidden;

}

.participant {

    height: 27px;

    display: flex;

    align-items: center;

    gap: 4px;

    padding:
        2px 6px
        2px 4px;

    background: rgba(139,139,139,.92);

    border:
        2px solid #373737;

    box-shadow:
        inset 1px 1px 0 rgba(255,255,255,.22),
        2px 2px 0 rgba(0,0,0,.20);

    white-space: nowrap;

    max-width: 125px;

}

.participant-skin {

    width: 20px;
    height: 20px;

    object-fit: cover;

    image-rendering: pixelated;

    flex: 0 0 20px;

}

.participant-name {

    max-width: 90px;

    overflow: hidden;

    text-overflow: ellipsis;

    color: #ffffff;

    font-family:
        "Press Start 2P",
        "Courier New",
        monospace;

    font-size: 6px;

    font-weight: 700;

    line-height: 1.2;

    text-shadow:
        1px 0 0 #333,
        -1px 0 0 #333,
        0 1px 0 #333,
        1px 1px 0 #333;

/* =========================================================
   WINNER FLASH
========================================================= */

.winner {

    animation:
        winnerFlash
        .35s
        steps(2);

}


@keyframes winnerFlash {

    0% {
        opacity: .5;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 1;
    }

/* =========================================================

.status,
.answer {
    width: 310px;
}

.participants {
    width: 310px;
}

</style>

</head>

/* =========================================================
   TWITCH CHANNEL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const requestedChannel =
    params.get("channel");


let CHANNEL =
    (
        !requestedChannel ||
        requestedChannel === "{channel}" ||
        requestedChannel.includes("{") ||
        requestedChannel.includes("}")
    )
        ? "rubius"
        : requestedChannel;


CHANNEL =
    CHANNEL
        .replace("#", "")
        .trim()
        .toLowerCase();


/* =========================================================
   CONFIG
========================================================= */


/*
    Tiempo mínimo entre mensajes procesados.
*/

/*
    Tiempo desde que alguien acierta
    hasta que aparece otra receta.
*/

const NEXT_RECIPE_COOLDOWN = 2500;


/*
    Versión de Minecraft usada para
    los assets.
*/

const MINECRAFT_VERSION = "26.3";


/* =========================================================
   ASSET URL
========================================================= */


/*
    Assets vanilla de Minecraft.

    Ejemplo:

    minecraft:diamond

    se convierte en:

    textures/item/diamond.png
*/

function getTexture(id) {

    if (!id) {

        return "";

    }


    const clean =
        id
            .replace(
                "minecraft:",
                ""
            );


    return (
        "https://mcasset.cloud/" +
        MINECRAFT_VERSION +
        "/assets/minecraft/" +
        "textures/item/" +
        clean +
        ".png"
    );

}

/* =========================================================
   STATE
========================================================= */

let currentRecipe = null;

let previousRecipe = null;

let locked = false;

let lastMessageTime = 0;

let twitchClient = null;


/* =========================================================
   DOM
========================================================= */

const grid =
    document.getElementById("grid");

const result =
    document.getElementById("result");

const status =
    document.getElementById("status");

const answer =
    document.getElementById("answer");

const chatStatus =
    document.getElementById("chatStatus");

const participants =
    document.getElementById("participants");


/* =========================================================
   PARTICIPANTES / SKINS
========================================================= */

/*
    Iconos aleatorios de skins/heads de Minecraft.
    Se asigna uno al usuario y se conserva durante
    la sesión del widget.
*/

const RANDOM_SKINS = [

    "MHF_Steve",
    "MHF_Alex",
    "MHF_Creeper",
    "MHF_Zombie",
    "MHF_Skeleton",
    "MHF_Enderman",
    "MHF_Pig",
    "MHF_Slime",
    "MHF_Ghast",
    "MHF_Blaze",
    "MHF_Spider",
    "MHF_Villager",
    "MHF_Chicken",
    "MHF_IronGolem"

];

const participantSkins =
    new Map();

let participantList = [];


function getRandomSkin(username) {

    if (participantSkins.has(username)) {

        return participantSkins.get(username);

    }


    const skin =
        RANDOM_SKINS[
            Math.floor(
                Math.random() *
                RANDOM_SKINS.length
            )
        ];


    participantSkins.set(
        username,
        skin
    );


    return skin;

}


function addParticipant(username) {

    if (!username) {
        return;
    }


    const existing =
        participantList.find(
            item =>
                item.username.toLowerCase() ===
                username.toLowerCase()
        );


    if (existing) {

        participantList =
            participantList.filter(
                item =>
                    item.username.toLowerCase() !==
                    username.toLowerCase()
            );

    }


    participantList.unshift({

        username: username,

        skin: getRandomSkin(username)

    });


    /*
        Mostramos solamente los últimos 3
        para que la zona inferior permanezca limpia.
    */

    participantList =
        participantList.slice(
            0,
            3
        );


    participants.innerHTML = "";


    participantList.forEach(
        participant => {

            const row =
                document.createElement("div");

            row.className =
                "participant";


            const img =
                document.createElement("img");

            img.className =
                "participant-skin";

            img.src =
                "https://mc-heads.net/avatar/" +
                participant.skin +
                "/20.png";

            img.alt =
                "";


            img.onerror =
                function() {

                    this.style.display =
                        "none";

                };


            const name =
                document.createElement("span");

            name.className =
                "participant-name";

            name.textContent =
                participant.username;


            row.appendChild(img);
            row.appendChild(name);

            participants.appendChild(row);

        }
    );

}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalize(text) {

    return String(text || "")

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /[^a-z0-9_ ]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}


/* =========================================================
   RANDOM RECIPE
========================================================= */

function getRandomRecipe() {

    if (RECIPES.length === 0) {

        return null;

    }


    let recipe;


    do {

        recipe =
            RECIPES[
                Math.floor(
                    Math.random() *
                    RECIPES.length
                )
            ];

    }

    while (

        RECIPES.length > 1 &&

        recipe.id ===
        previousRecipe

    );


    previousRecipe =
        recipe.id;


    return recipe;

}


/* =========================================================
   RENDER RECIPE
========================================================= */

function renderRecipe(recipe) {

    grid.innerHTML = "";


    recipe.pattern.forEach(
        (itemId) => {

            const slot =
                document.createElement(
                    "div"
                );

            slot.className =
                "slot";


            /*
                Un slot vacío.
            */

            if (
                !itemId ||
                itemId === " "
            ) {

                grid.appendChild(
                    slot
                );

                return;

            }


            const img =
                document.createElement(
                    "img"
                );

            img.className =
                "item";

            img.style.animationDelay =
                (
                    (
                        grid.children.length
                    ) * 45
                ) +
                "ms";


            img.src =
                getTexture(
                    itemId
                );


            img.alt =
                itemId;


            img.onerror =
                function() {

                    /*
                        Si una textura no existe,
                        ocultamos la imagen en vez
                        de romper el widget.
                    */

                    this.style.display =
                        "none";

                };


            slot.appendChild(
                img
            );


            grid.appendChild(
                slot
            );

        }
    );


    /*
        Ocultar resultado.
    */

    result.style.display =
        "none";


    result.classList.remove(
        "result-show"
    );


    answer.textContent =
        "";


    answer.className =
        "answer";


    status.textContent =
        "Esperando respuesta del chat...";

}


/* =========================================================
   NEW RECIPE
========================================================= */

function newRecipe() {

    locked = false;


    currentRecipe =
        getRandomRecipe();


    if (!currentRecipe) {

        status.textContent =
            "No hay recetas disponibles.";

        return;

    }


    renderRecipe(
        currentRecipe
    );

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function checkAnswer(
    username,
    message
) {

    /*
        Cooldown de mensajes.
    */

    const now =
        Date.now();


    if (
        now -
        lastMessageTime <
        MESSAGE_COOLDOWN
    ) {

        return;

    }


    lastMessageTime =
        now;


    /*
        No procesar mientras
        estamos cambiando de receta.
    */

    if (
        locked ||
        !currentRecipe
    ) {

        return;

    }


    addParticipant(
        username
    );


    const cleanMessage =
        normalize(
            message
        );


    const validAnswers = [
        currentRecipe.name,
        ...currentRecipe.aliases
    ]
        .map(normalize);


    /*
        También permitimos que el usuario
        escriba el nombre dentro de una
        frase corta.
    */

    const isCorrect =
        validAnswers.some(
            answerText =>
                cleanMessage ===
                answerText
        );


    if (!isCorrect) {

        return;

    }


    correctAnswer(
        username
    );

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

function correctAnswer(
    username
) {

    locked = true;


    /*
        Mostrar resultado.
    */

    result.src =
        getTexture(
            currentRecipe.id
        );


    result.alt =
        currentRecipe.name;


    result.style.display =
        "block";


    result.classList.add(
        "result-show"
    );


    /*
        Mostrar ganador.
    */

    answer.textContent =
        username +
        " acertó: " +
        currentRecipe.name;


    answer.className =
        "answer correct winner";


    /*
        Countdown.
    */

    let remaining =
        NEXT_RECIPE_COOLDOWN;


    function updateCountdown() {

        const seconds =
            Math.ceil(
                remaining / 1000
            );


        status.textContent =
            "Nuevo crafteo en " +
            seconds +
            "...";

    }


    updateCountdown();


    const interval =
        setInterval(
            () => {

                remaining -= 1000;


                if (
                    remaining <= 0
                ) {

                    clearInterval(
                        interval
                    );


                    newRecipe();


                    return;

                }


                updateCountdown();

            },
            1000
        );

}


/* =========================================================
   TWITCH CONNECTION
========================================================= */

function connectTwitch() {

    /*
        Conexión compatible con Pogly.

        Si Pogly no manda ?channel= o manda literalmente
        {channel}, CHANNEL ya habrá quedado en "rubius".
    */

    if (!CHANNEL) {

        status.textContent =
            "No se encontró el canal de Twitch.";

        chatStatus.textContent =
            "Twitch: sin canal";

        return;

    }


    /*
        Comprobar que tmi.js cargó.
    */

    if (
        typeof tmi ===
        "undefined"
    ) {

        status.textContent =
            "No se pudo cargar Twitch.";

        chatStatus.textContent =
            "Twitch: error";

        return;

    }


    /*
        Evitar conexiones duplicadas.
    */

    if (twitchClient) {

        try {

            twitchClient.disconnect();

        } catch (e) {

            console.warn(
                "No se pudo cerrar la conexión anterior.",
                e
            );

        }

        twitchClient = null;

    }


    /*
        Cliente TMI anónimo para leer el chat.
    */

    twitchClient =
        new tmi.Client({

            options: {
                debug: false
            },

            connection: {
                secure: true,
                reconnect: true,
                timeout: 20000
            },

            channels: [
                CHANNEL
            ]

        });


    /*
        Estado de conexión.
    */

    twitchClient.on(
        "connecting",
        () => {

            chatStatus.textContent =
                "● Twitch: conectando...";

        }
    );


    twitchClient.on(
        "connected",
        (address, port) => {

            status.textContent =
                "Esperando respuesta del chat...";

            chatStatus.textContent =
                "● Twitch: " +
                CHANNEL;

        }
    );


    twitchClient.on(
        "disconnected",
        (reason) => {

            console.warn(
                "Twitch desconectado:",
                reason
            );

            chatStatus.textContent =
                "● Twitch: reconectando...";

        }
    );


    twitchClient.on(
        "reconnect",
        () => {

            chatStatus.textContent =
                "● Twitch: reconectando...";

        }
    );


    twitchClient.on(
        "notice",
        (channel, msgid, message) => {

            console.warn(
                "Twitch notice:",
                msgid,
                message
            );

        }
    );


    /*
        Mensajes del chat.

        Solo un listener.
    */

    twitchClient.on(
        "message",
        (
            channel,
            tags,
            message,
            self
        ) => {

            if (self) {

                return;

            }


            const username =
                tags["display-name"] ||
                tags.username ||
                "Jugador";


            checkAnswer(
                username,
                message
            );

        }
    );


    /*
        Conectar.
    */

    twitchClient
        .connect()
        .catch(
            (error) => {

                console.error(
                    "Error conectando a Twitch:",
                    error
                );

                status.textContent =
                    "No se pudo conectar al chat.";

                chatStatus.textContent =
                    "Twitch: error";

            }
        );

}


/* =========================================================
   START
========================================================= */


/*
    IMPORTANTE:

    Esto hace que cada vez que el
    iframe se cargue/refresque se
    seleccione una receta nueva.
*/

newRecipe();


/*
    Después conectamos Twitch.
*/

connectTwitch();
